<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>印尼语受限词库造句器</title>
<style>

header{margin-bottom:24px}
h1{font-size:24px;margin-bottom:8px}
.desc{color:#555;margin-bottom:16px}
.box{background:#fff;border-radius:12px;padding:20px;margin-bottom:20px;box-shadow:0 1px 4px #00000012}

input{width:calc(100% - 120px);margin-right:8px}
button{cursor:pointer;background:#2563eb;color:white;border:none}
button.secondary{background:#666}
#result-main{margin-top:16px}
.sentence-item{padding:12px;border-bottom:1px solid #eee}
.tab-group{display:flex;gap:8px;margin-bottom:12px}
.tab{padding:8px 14px;border-radius:8px;border:1px solid #ddd;cursor:pointer}
.tab.active{background:#2563eb;color:white;border-color:#2563eb}
.hidden{display:none}
table{width:100%;border-collapse:collapse;margin-top:10px}
td,th{border:1px solid #e5e7eb;padding:10px;text-align:left}

</head>
<body>
<header>
<h1>印尼语词库造句器</h1>
<p class="desc">仅使用PPT内置词汇，不生成新词｜搜索中文，生成多句型印尼句子</p>
</header>

<div class="box">

<div style="margin-top: 15px; border-top: 1px dashed #ccc; padding-top: 15px;">
    <h3>🤖 AI 智能造句 (需 API Key)</h3>
    <input type="password" id="openai-key" placeholder="在此填入你的 OpenAI API Key (sk-...)" style="width:100%; margin-bottom:8px;">
    <button onclick="saveApiKey()" style="background:#10b981; margin-bottom:10px;">保存密钥</button>
    <div style="display:flex; gap:8px;">
        <input id="ai-prompt" placeholder="例如：用 makan 造三个不同语气的印尼语句子" style="flex:1;">
        <button onclick="askChatGPT()" style="width:auto;">AI 生成</button>
    </div>
    <div id="ai-result" style="margin-top:10px; background:#f0fdf4; padding:10px; border-radius:8px; display:none;"></div>
</div>
  <input id="search-input" placeholder="输入你想表达的中文含义，例如：我们需要定下清晰目标">
  <button onclick="doSearch()">搜索造句</button>
  <div style="margin-top:12px">
    <button class="secondary" onclick="switchTab('main')">首页（职场口语）</button>
    <button class="secondary" onclick="switchTab('grammarPage')">全部语法句型详情</button>
    <button class="secondary" onclick="switchTab('wordLib')">我的词库</button>
    <button class="secondary" onclick="switchTab('addWord')">添加新词</button>
    <button class="secondary" onclick="switchTab('history')">搜索历史</button>
  </div>
</div>

<!-- 首页 职场口语结果 -->
<div id="page-main" class="page">
<div class="box">
  <h3>✅ 职场口语句子（带语气词 nih/deh/kan/kok/sih/dong/nah）</h3>
  <div id="result-main"></div>
</div>
</div>

<!-- 语法详情子页面 -->
<div id="page-grammarPage" class="page hidden">
<div class="box">
  <h3>📚 同含义｜全语法从句集合</h3>
  <p>定语从句 / 名词性从句 / 让步/原因/时间/目的/结果状语从句</p>
  <div id="result-grammar"></div>
</div>
</div>

<!-- 词库页面 -->
<div id="page-wordLib" class="page hidden">
<div class="box">
  <h3>📖 我的词汇白名单（PPT原始词库+新增单词）</h3>
  <div id="wordlist"></div>
</div>
</div>

<!-- 添加新词 -->
<div id="page-addWord" class="page hidden">
<div class="box">
  <h3>➕ 添加新词到词库</h3>
  <p>新增后，后续造句才可以使用该单词</p>
  <p>支持批量粘贴，格式：印尼语=中文（每行一个，或用逗号隔开）</p>
<textarea id="batch-words" style="width:100%; height:150px; padding:10px; border-radius:8px; border:1px solid #ccc;" placeholder="例如：&#10;makan=吃&#10;minum=喝&#10;tidur=睡觉"></textarea>
<button onclick="addBatchWords()" style="margin-top:10px;">批量保存加入词库</button>
</div>
</div>

<!-- 历史记录 -->
<div id="page-history" class="page hidden">
<div class="box">
  <h3>🕒 搜索历史（点击可重新查询）</h3>
  <div id="history-list"></div>
</div>
</div>

let history = JSON.parse(localStorage.getItem("searchHistory")||"[]");

// 合并词库

  return [...wordWhiteList,...userWords];

// 页面切换
function switchTab(pageId){
  document.querySelectorAll(".page").forEach(p=>p.classList.add("hidden"));
  document.getElementById("page-"+pageId).classList.remove("hidden");
  if(pageId=="wordLib") renderWordList();
  if(pageId=="history") renderHistory();
}

// 搜索主逻辑
function doSearch(){
  const inputText = document.getElementById("search-input").value.trim();
  if(!inputText) return alert("请输入中文含义");
  const match = sentenceMap[inputText];
  let htmlMain = "";
  let htmlGrammar = "";
  if(match){
    // 首页 职场口语句子
    match.casual.forEach(item=>{
      htmlMain +=`
      <div class="sentence-item">
        <b>${item.id}</b><br>
        中文：${item.cn}<br>
        English：${item.en}
      </div>`;
    })
    // 语法详情页面
    const g = match.grammar;
    htmlGrammar +=`
    <table>
    <tr><th>句型分类</th><th>印尼语句子</th></tr>
    <tr><td>定语从句</td><td>${g.attr}</td></tr>
    <tr><td>名词性从句</td><td>${g.nounClause}</td></tr>
    <tr><td>让步状语从句</td><td>${g.concession}</td></tr>
    <tr><td>原因状语从句</td><td>${g.reason}</td></tr>
    <tr><td>时间状语从句</td><td>${g.time}</td></tr>
    <tr><td>目的状语从句</td><td>${g.purpose}</td></tr>
    <tr><td>结果状语从句</td><td>${g.result}</td></tr>
    </table>`;
    //保存历史
    if(!history.includes(inputText)) history.unshift(inputText);
    localStorage.setItem("searchHistory",JSON.stringify(history));
  }else{
    htmlMain = `<p>暂未预存该含义，系统会使用现有词库单词组合造句（你可以继续扩充词库）</p>`;
    htmlGrammar = `<p>暂无预定义从句模板，后续可以添加</p>`;
  }
  document.getElementById("result-main").innerHTML = htmlMain;
  document.getElementById("result-grammar").innerHTML = htmlGrammar;
  switchTab("main");
}

// 添加新词

function addBatchWords() {
    const rawText = document.getElementById("batch-words").value.trim();
    if (!rawText) return alert("请先粘贴单词");
    
    // 按换行或逗号分割
    const lines = rawText.split(/[\n,，]/);
    let count = 0;
    
    lines.forEach(line => {
        if (!line.trim()) return;
        // 支持 "="、"-"、":" 分隔
        const parts = line.split(/[=\-：:]/);
        if (parts.length >= 2) {
            const id = parts[0].trim();
            const cn = parts[1].trim();
            if (id && cn) {
                userWords.push({id, cn});
                count++;
            }
        }
    });
    
    localStorage.setItem("userWord", JSON.stringify(userWords));
    alert(`成功导入了 ${count} 个单词！`);
    document.getElementById("batch-words").value = "";
    renderWordList();
}

//渲染词库
function renderWordList(){
  const all = getAllWordList();
  let html = `<table><tr><th>印尼语</th><th>中文释义</th></tr>`;
  all.forEach(w=>{
    html +=`<tr><td>${w.id}</td><td>${w.cn}</td></tr>`;
  })
  html +=`</table>`;
  document.getElementById("wordlist").innerHTML = html;
}

//渲染历史
function renderHistory(){
  let html="";
  history.forEach(h=>{
    html +=`<div class="history-item" onclick="fillSearch('${h}')">${h}</div>`
  })
  document.getElementById("history-list").innerHTML = html;
}
function fillSearch(txt){
  document.getElementById("search-input").value = txt;
  doSearch();
}

async function askChatGPT() {
    const key = localStorage.getItem("openai_key");
    const prompt = document.getElementById("ai-prompt").value.trim();
    const resultBox = document.getElementById("ai-result");
    
    if (!key) return alert("请先填入并保存你的 OpenAI API Key！");
    if (!prompt) return alert("请输入你想表达的中文含义或要求！");
    
    resultBox.style.display = "block";
    resultBox.innerHTML = "🤖 AI 正在思考中，请稍候...";
    
    try {
        const response = await fetch("https://api.openai.com/v1/chat/completions", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${key}`
            },
            body: JSON.stringify({
                model: "gpt-4o-mini", // 推荐用 4o-mini，便宜且快。也可以用 gpt-3.5-turbo
                messages: [
                    { 
                        role: "system", 
                        content: "你是一个印尼语A1-B1级别的造句助手。请根据用户输入的中文或要求，生成印尼语句子。请给出：1.印尼语句子 2.中文翻译 3.语法结构说明。尽量包含口语语气词（如nih, deh, kan等）。" 
                    },
                    { role: "user", content: prompt }
                ],
                temperature: 0.7
            })
        });
        
        const data = await response.json();
        
        if (data.error) {
            resultBox.innerHTML = `<span style="color:red">错误：${data.error.message}</span>`;
        } else {
            // 将 AI 返回的换行符转换为 HTML 的换行
            const reply = data.choices[0].message.content.replace(/\n/g, "<br>");
            resultBox.innerHTML = `<b>AI 回答：</b><br>${reply}`;
        }
    } catch (error) {
        resultBox.innerHTML = `<span style="color:red">请求失败，请检查网络或 API 余额。</span>`;
    }
}
